spring.application.name=sistemaposjcs
spring.config.import=optional:file:.env[.properties]

server.port=8080
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}
app.security.jwt.expiration=${JWT_EXPIRATION:PT1H}
app.empresa.bootstrap-token=${EMPRESA_BOOTSTRAP_TOKEN:}
app.empresa.logo.namespace=${EMPRESA_LOGO_NAMESPACE:}
app.empresa.logo.max-size-bytes=${EMPRESA_LOGO_MAX_SIZE_BYTES:2097152}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.show-sql=false

spring.jackson.time-zone=America/Bogota
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

gemini.enabled=${GEMINI_ENABLED:true}
gemini.model=gemini-2.5-flash
gemini.api-key=${GEMINI_API_KEY:}
